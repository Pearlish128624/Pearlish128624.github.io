<meta charset="utf-8">
<script>
  /* Same clock as the greenhouse on the homepage: 5–16 morning, 16–19 afternoon, otherwise night. */
  (function(){var h=new Date().getHours(),t=h>=5&&h<16?'morning':h>=16&&h<19?'afternoon':'night',s,q=(location.search.match(/[?&]time=(morning|afternoon|night)/)||[])[1];s=null;try{s=localStorage.getItem('greenhouse-time')}catch(e){}document.documentElement.setAttribute('data-time',q||s||t);})();
</script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
<meta name="description" content="{{ page.summary | default: site.description }}">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 9 9'><rect x='1' y='5' width='7' height='4' fill='%23b0603e'/><rect x='4' y='1' width='1' height='4' fill='%234f8a4b'/><rect x='2' y='1' width='2' height='2' fill='%236fae5a'/><rect x='5' y='0' width='2' height='2' fill='%239fcf6e'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@400;500;700&display=swap" rel="stylesheet">
