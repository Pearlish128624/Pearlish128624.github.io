<!doctype html>
<html lang="zh-Hant">
<head>
{% include head.html %}
</head>
<body class="paper">
{% include nav.html %}
<main class="wrap">
  {% if page.banner %}
  <div class="banner" role="img" aria-label="像素插畫：從溫室玻璃窗看出去的天空、山丘與垂掛的植物">
    {%- assign times = "morning,afternoon,night" | split: "," -%}
    {%- for t in times %}
    <img class="px" data-t="{{ t }}" src="{{ '/assets/images/banner-' | append: t | append: '.png' | relative_url }}" width="256" height="48" alt="">
    {%- endfor %}
  </div>
  {% endif %}
  <h1 class="pagetitle">{{ page.title }}</h1>
  <div class="pagebody{% if page.name contains '.md' %} prose{% endif %}">
    {{ content }}
  </div>
</main>
</body>
</html>
